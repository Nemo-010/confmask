[package]
name = "confmask"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Confidential execution without trusted hardware: redact the /proc metadata of a process tree while programs keep their real arguments"
license = "0BSD"
repository = "https://github.com/Nemo-010/confmask"
keywords = ["confidential-computing", "privacy", "process", "secrets", "argv"]
categories = ["command-line-utilities", "os::linux-apis"]
readme = "README.md"
documentation = "https://docs.rs/confmask"
exclude = [
    "vm/cache",
    "vm/*.img",
    "vm/output*.log",
    "tests/confmask",
    "tests/confmaskd",
    "tests/testcases",
    "tests/testcases32",
    "tests/protocases",
    "tests/gospawn",
]

[lib]
name = "confmask"
path = "src/lib.rs"

[[bin]]
name = "confmask"
path = "src/main.rs"

[[bin]]
name = "confmaskd"
path = "src/bin/confmaskd.rs"

[[bin]]
name = "confmask-testcases"
path = "src/bin/testcases.rs"

[[bin]]
name = "confmask-protocases"
path = "src/bin/protocases.rs"

[dependencies]
libc = "0.2"
zeroize = "1"
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["std"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
